<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Painel Admin</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
        integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>
</head>


<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item active">
                <a class="nav-link" href="#">Painel <span class="sr-only">(current)</span></a>
            </li>
        </ul>
    </div>
</nav>

<body class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Painel Administrativo - Bem-vindo, {{ nome }}.</h2>
        <a href="/logout" class="btn btn-outline-danger">Sair</a>
    </div>
    <div class="card p-3 shadow-sm mb-4">
        <h4>Cadastrar Usuário</h4>
        <form method="POST">
            <input type="hidden" name="acao" value="cadastrar_usuario">
            <input type="text" name="nome" placeholder="Nome" class="form-control mb-2" required>
            <input type="email" name="email" placeholder="E-mail" class="form-control mb-2" required>
            <input type="password" name="senha" placeholder="Senha" class="form-control mb-2" required>
            <select name="perfil" class="form-control mb-2">
                <option value="comum">Comum</option>
                <option value="admin">Administrador</option>
            </select>
            <button class="btn btn-success w-100">Salvar Usuário</button>
        </form>
    </div>

    <div class="card p-3 shadow-sm mb-4">
        <h4>Usuários Cadastrados</h4>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Perfil</th>
                        <th>⚙️</th>
                    </tr>
                </thead>
                <tbody>
                    {% for u in usuarios %}
                    <tr>
                        <td>{{ u.id }}</td>
                        <td><b>{{ u.nome }}</b></td>
                        <td>{{ u.email }}</td>

                        <td><span
                                class="badge {% if u.perfil == 'admin' %}bg-danger{% else %}bg-secondary{% endif %}">{{
                                u.perfil }}</span></td>
                        <td><span>

                                <div class="dropdown">
                                    <button class="btn btn-secondary dropdown-toggle" type="button"
                                        id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true"
                                        aria-expanded="false"></button>
                                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">

                                        <button class="dropdown-item" data-toggle="modal"
                                            data-target="#exampleModalCenter">Alterar dados</button>




                                        <form action="admin" method="post">
                                            <input type="hidden" name="acao" value="deletar_usuario">
                                            <input type="hidden" name="id" value='{{ u.id }}'>
                                            <button class="dropdown-item" type="submit" name="id" value="id"
                                                class="btn-link">
                                                Excluir usuario
                                            </button>
                                        </form>


                                    </div>
                                </div>

                            </span></td>
                    </tr>

                    <div class="modal fade" id="exampleModalCenter" tabindex="-1" role="dialog"
                        aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered" role="document">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="exampleModalLongTitle">Alterar dados do Usuário através
                                        do id</h5>
                                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                        <span aria-hidden="true">&times;</span>
                                    </button>
                                </div>
                                <div class="modal-body">


                                    <div class="card p-3 shadow-sm mb-4">
                                        <form method="POST">
                                            <input type="hidden" name="acao" value="atualizar_usuario">
                                            <input type="number" name="id" placeholder="id" class="form-control mb-2"
                                                required>
                                            <input type="text" name="nome" placeholder="Nome" class="form-control mb-2"
                                                required>
                                            <input type="email" name="email" placeholder="E-mail"
                                                class="form-control mb-2" required>
                                            <input type="password" name="senha" placeholder="Senha"
                                                class="form-control mb-2" required>
                                            <select name="perfil" class="form-control mb-2">
                                                <option value="comum">Comum</option>
                                                <option value="admin">Administrador</option>
                                            </select>
                                            <button class="btn btn-success w-50"
                                                style="position: relative; left: 50%;">Salvar Usuário</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                </tbody>
            </table>
        </div>
    </div>






</body>

</html>
